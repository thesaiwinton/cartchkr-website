<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --brand-red:   #B91C1C;
  --brand-green: #1a8c37;
  --woolies:     #1a8c37;
  --woolies-bg:  #edfbf1;
  --woolies-mid: #bbf0cc;
  --coles:       #e2231a;
  --coles-bg:    #fff1f0;
  --coles-mid:   #ffc9c7;
  --green:       #15803d;
  --green-bg:    #dcfce7;
  --green-mid:   #86efac;
  --accent:      #2563eb;   /* "same" — extension's canonical blue */
  --accent-bg:   #eff6ff;
  --accent-mid:  #bfdbfe;
  --red:         #b91c1c;   /* "more" — extension's canonical red (distinct from coles brand red) */
  --red-bg:      #fee2e2;
  --red-mid:     #fca5a5;
  --yellow:      #92400e;   /* "no match" — extension's canonical yellow (brownish text) */
  --yellow-bg:   #fef3c7;
  --yellow-mid:  #fde68a;
  --bg:          #f8f9fa;
  --surface:     #ffffff;
  --fg:          #1a1a1a;
  --muted:       #6b7280;
  --border:      #e5e7eb;
  --shadow:      0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
}

html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--bg); color: var(--fg);
  line-height: 1.55; font-size: 16px;
  -webkit-font-smoothing: antialiased;
}

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,.94);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border); padding: 0 24px;
}
.nav-inner {
  max-width: 1080px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; height: 56px;
}
.wordmark {
  font-size: 22px; font-weight: 800; letter-spacing: -.02em;
  display: flex; align-items: center; gap: 8px; text-decoration: none;
}
.wordmark .c1 { color: var(--brand-red); }
.wordmark .c2 { color: var(--brand-green); }
.nav-cta {
  background: var(--brand-green); color: #fff; border: none;
  border-radius: 100px; padding: 8px 20px; font-size: 14px;
  font-weight: 700; cursor: pointer; text-decoration: none; transition: opacity .15s;
}
.nav-cta:hover { opacity: .85; }

/* ── HERO ── */
.hero {
  background: linear-gradient(160deg, #fff 0%, #f0fdf4 60%, #fff8f8 100%);
  padding: 60px 24px 52px; border-bottom: 1px solid var(--border);
  overflow: hidden;
}
.hero-inner {
  max-width: 1080px; margin: 0 auto;
  display: flex; flex-direction: column; align-items: center; gap: 36px;
  text-align: center;
}
.hero-head { max-width: 720px; display: flex; flex-direction: column; align-items: center; }
.hero-visuals {
  width: 100%;
  display: grid; grid-template-columns: minmax(0, 240px) minmax(0, 1fr);
  gap: 40px; align-items: center; justify-items: center;
}
.hero-video-wrap { width: 100%; display: flex; justify-content: center; }
.hero-actions { display: flex; flex-direction: column; align-items: center; gap: 14px; }
@media (max-width: 900px) {
  .hero-visuals { grid-template-columns: 1fr; gap: 28px; }
  .hero-shot-wrap { order: 0; max-width: 280px; }
  .hero-video-wrap { order: 1; }
}
.hero-text { display: flex; flex-direction: column; align-items: center; }
.founding-badge {
  display: inline-flex; align-items: center; gap: 10px;
  background: #fefce8; border: 1.5px solid #fde047;
  border-radius: 100px; padding: 7px 16px;
  font-size: 13px; font-weight: 600; color: #713f12;
  margin-bottom: 22px;
}
.founding-badge .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #eab308; animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.hero h1 {
  font-size: clamp(30px, 4.5vw, 52px); font-weight: 800;
  line-height: 1.08; letter-spacing: -.03em; margin-bottom: 16px;
}
.hero h1 em { font-style: normal; color: var(--green); }
.hero-sub { font-size: clamp(15px, 1.8vw, 18px); color: var(--muted); margin-bottom: 32px; line-height: 1.55; }
.hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin: 0; }
.btn-primary {
  background: var(--brand-green); color: #fff; border: none; border-radius: 100px;
  padding: 14px 32px; font-size: 17px; font-weight: 700; cursor: pointer;
  text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
  transition: transform .15s, box-shadow .15s; box-shadow: 0 4px 14px rgba(26,140,55,.35);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(26,140,55,.45); }
.btn-secondary {
  background: transparent; color: var(--muted); border: 1.5px solid var(--border);
  border-radius: 100px; padding: 14px 24px; font-size: 16px; font-weight: 600;
  cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  transition: border-color .15s, color .15s;
}
.btn-secondary:hover { border-color: var(--muted); color: var(--fg); }
.hero-note { font-size: 12px; color: var(--muted); }
.hero-note strong { color: var(--brand-red); }

/* hero panel — perspective-tilted CSS mockup */
.hero-shot-wrap {
  perspective: 1100px;
  display: flex; justify-content: center;
}
.hero-shot {
  width: 100%; max-width: 300px;
  zoom: 0.8;
  transform: rotateY(-18deg) rotateX(4deg) scale(1.02);
  transform-style: preserve-3d;
  transition: transform .4s ease, box-shadow .4s ease;
  border-radius: 14px;
  box-shadow: 28px 20px 64px rgba(0,0,0,.25), 4px 4px 16px rgba(0,0,0,.1);
}
.hero-shot:hover {
  transform: rotateY(-10deg) rotateX(2deg) scale(1.04);
  box-shadow: 20px 16px 48px rgba(0,0,0,.2), 2px 2px 10px rgba(0,0,0,.08);
}
.hero-video {
  width: 100%; max-width: 520px;
  border-radius: 14px;
  box-shadow: 0 12px 36px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.08);
  display: block;
  background: #000;
}
@media (max-width: 760px) {
  .hero-video { max-width: 100%; }
}


/* ── SHARED EXTENSION PANEL CSS COMPONENT ── */
.xpanel {
  background: #fff; border-radius: 14px;
  box-shadow: 0 4px 24px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.06);
  overflow: hidden; font-size: 13px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  user-select: none;
}
.xpanel-hdr {
  padding: 10px 13px 8px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 14px;
}
.xpanel-stores {
  display: flex; gap: 7px; padding: 9px 13px; border-bottom: 1px solid var(--border);
}
.xbtn {
  flex: 1; padding: 8px 4px; border-radius: 8px; font-weight: 700; font-size: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 3px; border: 1.5px solid transparent;
}
.xbtn-label { font-size: 10px; }
.xbtn-w { background: var(--woolies-bg); color: var(--woolies); border-color: var(--woolies-mid); }
.xbtn-c { background: var(--coles-bg); color: var(--coles); border-color: var(--coles-mid); }
.xbtn-dim { opacity: .45; }
.xtotals {
  display: flex; justify-content: space-between;
  padding: 6px 13px; border-bottom: 1px solid var(--border); font-size: 12px;
}
.xtotal-col { text-align: center; }
.xtotal-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.xtotal-val { font-weight: 800; }
.xtotal-win { color: var(--green); }
.xprogress { padding: 8px 13px; border-bottom: 1px solid var(--border); }
.xprogress-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 5px; }
.xprogress-track { height: 5px; background: #e5e7eb; border-radius: 100px; overflow: hidden; }
.xprogress-fill { height: 100%; background: #3b82f6; border-radius: 100px; }
.xchips {
  display: flex; gap: 4px; padding: 7px 13px; border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.xchip {
  padding: 2px 8px; border-radius: 100px; font-size: 10px; font-weight: 600; border: 1.5px solid transparent;
}
/* mockup chip palette — matches extension's canonical state colours:
   cheaper=green, same=blue, more=red, no-match=yellow.
   Class suffixes (-g/-s/-o/-r) are legacy labels; ignore the letters, trust the rule. */
.xchip-g { background: var(--green-bg);  color: var(--green);  border-color: var(--green-mid); }   /* cheaper */
.xchip-s { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-mid); }  /* same */
.xchip-o { background: var(--red-bg);    color: var(--red);    border-color: var(--red-mid); }    /* more */
.xchip-r { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-mid); }  /* no match */
.xitems { }
.xitem {
  display: flex; align-items: flex-start; gap: 6px; padding: 6px 13px;
  border-bottom: 1px solid #f9fafb;
}
.xitem:last-child { border-bottom: none; }
.xitem-name { flex: 1; font-size: 11px; line-height: 1.3; color: var(--fg); }
.xitem-sub { font-size: 9px; color: var(--muted); }
.xbadge {
  font-size: 10px; font-weight: 700; padding: 2px 6px;
  border-radius: 6px; white-space: nowrap; flex-shrink: 0; margin-top: 1px;
}
/* mockup badge palette — same colour system as chips */
.xbadge-g { background: var(--green-bg);  color: var(--green); }    /* cheaper */
.xbadge-r { background: var(--red-bg);    color: var(--red); }      /* more (e.g. +$1.35) */
.xbadge-s { background: var(--accent-bg); color: var(--accent); }   /* same */
.xbadge-n { background: var(--yellow-bg); color: var(--yellow); }   /* no match */
.xarrow {
  font-size: 10px; font-weight: 700; padding: 2px 7px;
  border-radius: 100px; background: var(--woolies); color: #fff; white-space: nowrap; flex-shrink: 0;
}
/* completion state */
.xdone {
  padding: 14px 13px 16px; background: var(--green-bg);
  border-top: 1px solid #bbf7d0; text-align: center;
}
.xdone-text {
  font-weight: 800; color: var(--green); font-size: 12px;
  letter-spacing: .02em; margin-bottom: 10px;
}
.xdone-tick {
  width: 52px; height: 52px; border-radius: 50%; background: var(--green);
  display: flex; align-items: center; justify-content: center; margin: 0 auto;
  box-shadow: 0 4px 14px rgba(21,128,61,.4);
}
.xdone-tick svg { width: 28px; height: 28px; }

/* small cart svg icon */
.cart-icon-w, .cart-icon-c { display: block; }

/* ── SOCIAL PROOF BAR ── */
.proof-bar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 11px 24px; font-size: 13px; color: var(--muted);
  display: flex; justify-content: center; align-items: center; gap: 24px; flex-wrap: wrap;
}
.proof-item { display: flex; align-items: center; gap: 6px; }
.proof-item strong { color: var(--fg); font-weight: 700; }

/* ── SECTION COMMON ── */
section { padding: 72px 24px; }
.section-inner { max-width: 1080px; margin: 0 auto; }
.section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 10px; }
.section-heading { font-size: clamp(24px, 3.5vw, 36px); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin-bottom: 14px; }
.section-sub { font-size: 17px; color: var(--muted); max-width: 560px; line-height: 1.5; }

/* ── HOW IT WORKS ── */
.how-section { background: var(--surface); }
.steps { display: grid; grid-template-columns: repeat(3,1fr); gap: 32px; margin-top: 48px; }
@media (max-width: 640px) { .steps { grid-template-columns: 1fr; } }
.step { display: flex; flex-direction: column; gap: 14px; }
.step-visual {
  border-radius: 12px; overflow: hidden;
  box-shadow: 0 2px 16px rgba(0,0,0,.1), 0 0 0 1px rgba(0,0,0,.05);
}
/* try real image first, fall back handled by JS */
.step-img-wrap {
  position: relative; aspect-ratio: 1 / 1.9; background: #f3f4f6; overflow: hidden;
}
.step-img-wrap img {
  position: absolute; top: 0; right: 0; width: 100%; height: 100%; object-fit: cover; object-position: right top;
}
.step-num {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--green-bg); color: var(--green); font-weight: 800; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
.step h3 { font-size: 16px; font-weight: 700; margin: 0; }
.step p { font-size: 14px; color: var(--muted); line-height: 1.5; margin: 0; }

/* ── DEMO SECTION ── */
.demo-section { background: var(--bg); }
.demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 48px; align-items: start; }
@media (max-width: 720px) { .demo-grid { grid-template-columns: 1fr; } }
.demo-pair { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.demo-fig { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 8px; }
.demo-cap { font-size: 12px; color: var(--muted); text-align: center; font-weight: 500; }
.demo-fig--featured .xpanel { box-shadow: 0 8px 32px rgba(21,128,61,.2), 0 0 0 2.5px #86efac; }
.demo-context { display: flex; flex-direction: column; gap: 24px; justify-content: center; }
.demo-feature { display: flex; gap: 14px; align-items: flex-start; }
.demo-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.demo-feature h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.demo-feature p { font-size: 14px; color: var(--muted); line-height: 1.5; }

/* ── SECURITY ── */
.security-section { background: linear-gradient(135deg,#052e16 0%,#14532d 100%); padding: 56px 24px; color: #fff; }
.security-inner { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr; gap: 52px; align-items: center; }
@media (max-width: 640px) { .security-inner { grid-template-columns: 1fr; text-align: center; } }
.security-shield { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.shield-box {
  width: 108px; height: 108px;
  background: rgba(234,179,8,.1); border: 2px solid rgba(234,179,8,.4);
  border-radius: 24px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 36px rgba(234,179,8,.2);
}
.shield-lbl { font-size: 11px; font-weight: 700; color: #fbbf24; text-transform: uppercase; letter-spacing: .08em; }
.sec-points { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 36px; }
@media (max-width: 480px) { .sec-points { grid-template-columns: 1fr; } }
.sec-pt { display: flex; gap: 10px; align-items: flex-start; }
.sec-pt-ico { font-size: 18px; flex-shrink: 0; }
.sec-pt h4 { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 3px; }
.sec-pt p { font-size: 13px; color: #9ca3af; line-height: 1.45; }

/* ── PRICING ── */
.pricing-section { background: var(--surface); }
.pricing-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(210px,1fr)); gap: 20px; margin-top: 48px; align-items: start; }
.plan-card { background: var(--bg); border: 1.5px solid var(--border); border-radius: 16px; padding: 28px 24px; position: relative; transition: box-shadow .2s, border-color .2s; }
.plan-card:hover { box-shadow: var(--shadow); border-color: #d1d5db; }
.plan-card.featured { background: #fff; border: 2.5px solid var(--brand-green); box-shadow: 0 4px 24px rgba(26,140,55,.15); }
.plan-badge { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); background: var(--brand-green); color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 4px 14px; border-radius: 100px; white-space: nowrap; }
.plan-name { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
.plan-price { font-size: 42px; font-weight: 800; letter-spacing: -.03em; line-height: 1; margin-bottom: 4px; }
.plan-price sup { font-size: 22px; vertical-align: top; margin-top: 6px; font-weight: 700; }
.plan-cadence { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.plan-features { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; font-size: 14px; }
.plan-features li { display: flex; align-items: flex-start; gap: 8px; }
.plan-features li::before { content: "✓"; color: var(--green); font-weight: 700; flex-shrink: 0; }
.plan-features li.star::before { content: "★"; color: #eab308; }
.plan-cta { display: block; width: 100%; text-align: center; padding: 12px; border-radius: 100px; font-weight: 700; font-size: 15px; text-decoration: none; border: none; cursor: pointer; transition: opacity .15s, transform .15s; }
.plan-cta:hover { opacity: .85; transform: translateY(-1px); }
.plan-cta-g { background: var(--brand-green); color: #fff; }
.plan-cta-o { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
.founding-counter { margin-top: 32px; background: #fefce8; border: 1.5px solid #fde047; border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.counter-label { font-size: 14px; color: #713f12; flex: 1; min-width: 200px; }
.counter-label strong { font-weight: 800; }
.counter-bar-wrap { flex: 1; min-width: 160px; }
.counter-bar-track { height: 8px; background: #fef08a; border-radius: 100px; overflow: hidden; }
.counter-bar-fill { height: 100%; background: #eab308; border-radius: 100px; width: 40%; transition: width 1s ease; }
.counter-bar-text { font-size: 12px; color: #a16207; margin-top: 4px; font-weight: 600; }

/* ── FAQ ── */
.faq-section { background: var(--bg); }
.faq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 40px; margin-top: 48px; }
@media (max-width: 640px) { .faq-grid { grid-template-columns: 1fr; } }
.faq-item h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.faq-item p { font-size: 14px; color: var(--muted); line-height: 1.55; }

/* ── FOOTER CTA ── */
.footer-cta { background: linear-gradient(135deg,#052e16 0%,#14532d 100%); color:#fff; padding:72px 24px; text-align:center; }
.footer-cta h2 { font-size: clamp(24px,4vw,40px); font-weight:800; letter-spacing:-.02em; margin-bottom:12px; }
.footer-cta p { font-size:17px; color:#86efac; margin-bottom:32px; }
.btn-white { background:#fff; color:var(--green); border:none; border-radius:100px; padding:14px 36px; font-size:17px; font-weight:800; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:8px; transition:transform .15s,box-shadow .15s; box-shadow:0 4px 20px rgba(0,0,0,.2); }
.btn-white:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(0,0,0,.3); }

/* ── FOOTER ── */
footer { background:#111; color:#6b7280; padding:32px 24px; font-size:13px; }
footer a { color:#9ca3af; text-decoration:none; }
footer a:hover { color:#fff; }
.footer-inner { max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:12px; align-items:center; }
.footer-links { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
